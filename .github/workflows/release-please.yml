name: release-please

# On every push to main, release-please keeps a "chore(main): release X.Y.Z"
# pull request up to date (CHANGELOG.md) from the conventional commits.
# Merging that PR creates the vX.Y.Z tag and the GitHub release: the apps take
# the kit as a submodule pinned on such a tag, never on a commit of main.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      # A token of the release GitHub App, not GITHUB_TOKEN: its pushes to the
      # release PR trigger the other workflows, and it can create the tag.
      # Without the app (not set up yet), nothing is released.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: vars.RELEASE_APP_ID != ''
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID || vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: vars.RELEASE_APP_ID != ''
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
