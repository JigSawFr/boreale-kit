name: ci

# The host tests under gcc and clang with the sanitizers, and the layer rules
# (tools/check_sources.py), and the files that stand on libnx built for the
# Switch in devkitPro's image, as the apps build them.
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [ gcc, clang ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: make test (${{ matrix.cc }})
        run: make test CC=${{ matrix.cc }} CXX=${{ matrix.cc == 'gcc' && 'g++' || 'clang++' }}

  sources:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Layer rules
        run: python3 tools/check_sources.py .
      - name: String catalogs
        run: python3 tools/check_resources.py .

  switch:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    container:
      # The image boreale-link builds with (its ci.yml), pinned by digest.
      image: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Build the console's C for the Switch
        run: |
          set -e
          CC="$DEVKITPRO/devkitA64/bin/aarch64-none-elf-gcc"
          mkdir -p build/switch
          for f in source/core/*.c; do
            "$CC" -std=gnu11 -Wall -Wextra -Wshadow -Werror -march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft \
              -fPIE -ffunction-sections -fdata-sections -D__SWITCH__ -I"$DEVKITPRO/libnx/include" -I"$DEVKITPRO/portlibs/switch/include" \
              -Isource -Isource/core -Itests/stub -Ilibrary/boreale-link/source \
              -c "$f" -o "build/switch/$(basename "$f" .c).o"
          done
          ls -l build/switch
